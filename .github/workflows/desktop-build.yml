name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  web:
    name: Build Vue frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: agent_workbench/web
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build frontend
        working-directory: agent_workbench/web
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: agent_workbench/web/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: ${{ matrix.name }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            python_arch: x64
            artifact: micromatrix-workbench-windows-x64

          - name: Windows ARM64
            runner: windows-11-arm
            python_arch: arm64
            artifact: micromatrix-workbench-windows-arm64

          - name: macOS x64
            runner: macos-15-intel
            python_arch: x64
            artifact: micromatrix-workbench-macos-x64

          - name: macOS ARM64
            runner: macos-15
            python_arch: arm64
            artifact: micromatrix-workbench-macos-arm64

          - name: Linux x64
            runner: ubuntu-24.04
            python_arch: x64
            artifact: micromatrix-workbench-linux-x64

          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            python_arch: arm64
            artifact: micromatrix-workbench-linux-arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-desktop.txt

      - name: Verify native build environment
        run: python scripts/verify_build_environment.py --expected-arch "${{ matrix.python_arch }}"

      - name: Download bundled cloudflared
        run: python scripts/fetch_cloudflared.py

      - name: Download frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web-dist

      - name: Build desktop application
        run: python build_desktop.py --web-dist web-dist

      - name: Package release file
        run: python scripts/package_release.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: micromatrix-workbench-*
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "MicroMatrix Workbench $GITHUB_REF_NAME" \
              --generate-notes
          fi
